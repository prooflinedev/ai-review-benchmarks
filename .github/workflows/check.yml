name: Check the sample application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package the commit and smoke-test its Lambda handler
        run: |
          python3 aws/deploy.py package --output "$RUNNER_TEMP/report-stack.json"
          python3 aws/deploy.py smoke --template "$RUNNER_TEMP/report-stack.json"
